name: oodac CI

on:
  push:
    branches: [main, phase-0-honest-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.2.15)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # 8-Gate enforcement map (practices/8d-red-team.oot). Each gate names its
  # CI stanza below; gaps are recorded, not hidden:
  # G1 lowering integrity: compiler-not-concat, emit-needs-check, tokenize-once, no-chs-rt
  # G2 bounds: cap-sealed, borrowck must-fail, json-errors, 256-line-cap step
  # G3 wiring: build-is-check, std-import, four-mains, elf-hash, isolated-check
  # G4 isolation: landlock-jail, cap-sealed
  # G5 replay: double-run sealed x2, smt const-false x2, smt unproven x2, struct-arc x2
  # G6 drag: tokenize-once, struct-arc soak, 256-line-cap step
  # G7 contracts: attach-contract, smt const-false, smt unproven
  # G8 crypto timing: NOT oodac scope (oodar challenger harness per RFC-0001)
  # Recorded gap: mutation kill-rate (G7 full) has no harness yet.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: oodac
      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - uses: actions/checkout@v4
        with:
          repository: openOODA/ooda
          path: ooda
      - uses: actions/checkout@v4
        with:
          repository: openOODA/lsp
          path: lsp
      - uses: actions/checkout@v4
        with:
          repository: openOODA/mcp
          path: mcp
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Count ANCHOR imports
        run: |
          n=$(grep -c '^import "' oodac/ANCHOR.oo)
          echo "ANCHOR imports: $n"
          test "$n" = "6"
      - name: 256-line cap (Gates 2/6)
        # tests/fixtures holds deliberate invalid inputs (boundary_257_lines.oo
        # must exceed the cap to test the boundary); everything else must comply.
        run: |
          over=$(cd oodac && find . -name '*.oo' -not -path './.ooda-cache/*' -not -path './tests/fixtures/*' | xargs wc -l 2>/dev/null | awk '$1 > 256 && $2 != "total"')
          test -z "$over"
          oot_over=$(cd oodac && find . -name '*.oot' | xargs wc -l 2>/dev/null | awk '$1 > 256 && $2 != "total"')
          test -z "$oot_over"
      - name: Unique C bar
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODAC_BIN: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          set -eu
          HOST="$OODA_COMPILER"
          test -x "$HOST"
          mkdir -p .ooda-cache/ooda-tmp
          echo "=== help 1 ==="
          "$HOST" --help
          echo "=== help 2 ==="
          "$HOST" --help
          echo "=== backend residuals ==="
          set +e
          "$HOST" build oodac/qa/probe_list_ok.oo --backend wasm
          wasm_rc=$?
          "$HOST" build oodac/qa/probe_list_ok.oo --backend x86
          x86_rc=$?
          "$HOST" build oodac/qa/probe_list_ok.oo --backend aarch64
          a64_rc=$?
          "$HOST" build oodac/qa/probe_list_ok.oo --backend romc
          rom_rc=$?
          set -e
          echo "wasm_rc=$wasm_rc x86_rc=$x86_rc a64_rc=$a64_rc rom_rc=$rom_rc"
          test "$wasm_rc" -eq 2
          test "$x86_rc" -eq 2
          test "$a64_rc" -eq 2
          test "$rom_rc" -eq 2
          echo "=== flags-only ==="
          set +e
          "$HOST" --backend c
          fo_rc=$?
          set -e
          echo "fo_rc=$fo_rc"
          test "$fo_rc" -eq 2
          echo "=== json-errors ==="
          "$HOST" build --backend c oodac/qa/probe_json_errors.oo -o .ooda-cache/ooda-tmp/ci_json.bin
          .ooda-cache/ooda-tmp/ci_json.bin
          echo "=== cap sealed ==="
          set +e
          "$HOST" check oodac/qa/probe_cap_sealed.oo
          cap_rc=$?
          set -e
          echo "cap_rc=$cap_rc"
          test "$cap_rc" -ne 0
          echo "=== borrowck ==="
          "$HOST" build --backend c oodac/qa/probe_borrow_kind.oo -o .ooda-cache/ooda-tmp/ci_borrow.bin
          .ooda-cache/ooda-tmp/ci_borrow.bin
          echo "=== borrowck copy-ops ==="
          "$HOST" check oodac/qa/probe_borrow_copy_ops.oo
          "$HOST" build --backend c oodac/qa/probe_borrow_copy_ops.oo -o .ooda-cache/ooda-tmp/ci_borrow_copy.bin
          .ooda-cache/ooda-tmp/ci_borrow_copy.bin
          echo "=== borrowck must-fail ==="
          set +e
          "$HOST" check oodac/qa/probe_borrow_move.oo
          move_rc=$?
          "$HOST" check oodac/qa/probe_borrow_mut_alias.oo
          mut_rc=$?
          set -e
          echo "move_rc=$move_rc mut_rc=$mut_rc"
          test "$move_rc" -ne 0
          test "$mut_rc" -ne 0
          echo "=== well-typed twins ==="
          "$HOST" check oodac/qa/probe_list_ok.oo
          "$HOST" check oodac/qa/probe_option_ok.oo
          "$HOST" check oodac/qa/probe_result_main_ok.oo
          echo "=== list kind driver ==="
          "$HOST" build --backend c oodac/qa/probe_list_kind.oo -o .ooda-cache/ooda-tmp/ci_list_kind.bin
          .ooda-cache/ooda-tmp/ci_list_kind.bin
          echo "=== option kind driver ==="
          "$HOST" build --backend c oodac/qa/probe_option_kind.oo -o .ooda-cache/ooda-tmp/ci_option_kind.bin
          .ooda-cache/ooda-tmp/ci_option_kind.bin
          echo "=== result kind driver ==="
          "$HOST" build --backend c oodac/qa/probe_result_kind.oo -o .ooda-cache/ooda-tmp/ci_result_kind.bin
          .ooda-cache/ooda-tmp/ci_result_kind.bin
          echo "=== build is check ==="
          "$HOST" build --backend c oodac/qa/probe_build_is_check.oo -o .ooda-cache/ooda-tmp/ci_build_is_check.bin
          .ooda-cache/ooda-tmp/ci_build_is_check.bin
          echo "=== landlock jail ==="
          "$HOST" build --backend c oodac/qa/probe_landlock_jail.oo -o .ooda-cache/ooda-tmp/ci_landlock_jail.bin
          .ooda-cache/ooda-tmp/ci_landlock_jail.bin
          echo "=== std import ==="
          "$HOST" build --backend c oodac/qa/probe_std_import_run.oo -o .ooda-cache/ooda-tmp/ci_std_import.bin
          .ooda-cache/ooda-tmp/ci_std_import.bin
          echo "=== tokenize-once artifact ==="
          "$HOST" build --backend c oodac/qa/probe_tokenize_once.oo -o .ooda-cache/ooda-tmp/ci_tok_once.bin
          .ooda-cache/ooda-tmp/ci_tok_once.bin
          "$HOST" build --backend c oodac/qa/probe_artifact_mutate.oo -o .ooda-cache/ooda-tmp/ci_art_mut.bin
          .ooda-cache/ooda-tmp/ci_art_mut.bin
          "$HOST" build --backend c oodac/qa/probe_checkfail_no_artifact.oo -o .ooda-cache/ooda-tmp/ci_art_fail.bin
          .ooda-cache/ooda-tmp/ci_art_fail.bin
          echo "=== emit needs check ==="
          "$HOST" build --backend c oodac/qa/probe_emit_needs_check.oo -o .ooda-cache/ooda-tmp/ci_emit_need.bin
          .ooda-cache/ooda-tmp/ci_emit_need.bin
          echo "=== no chs_rt ==="
          "$HOST" build --backend c oodac/qa/probe_no_chs_rt.oo -o .ooda-cache/ooda-tmp/ci_no_chs.bin
          .ooda-cache/ooda-tmp/ci_no_chs.bin
          echo "=== four product mains ==="
          "$HOST" build --backend c oodac/qa/probe_four_mains.oo -o .ooda-cache/ooda-tmp/ci_four.bin
          .ooda-cache/ooda-tmp/ci_four.bin
          echo "=== ecap capless-net refuse (Task 2a) ==="
          "$HOST" build --backend c oodac/qa/probe_ecap_capless_net.oo -o .ooda-cache/ooda-tmp/ci_ecap.bin
          .ooda-cache/ooda-tmp/ci_ecap.bin
          echo "=== attach contract ==="
          "$HOST" build --backend c oodac/qa/probe_attach_contract.oo -o .ooda-cache/ooda-tmp/ci_attach.bin
          .ooda-cache/ooda-tmp/ci_attach.bin
          echo "=== struct field arc ==="
          "$HOST" build --backend c oodac/qa/probe_struct_field_arc.oo -o .ooda-cache/ooda-tmp/ci_struct_arc.bin
          .ooda-cache/ooda-tmp/ci_struct_arc.bin
          .ooda-cache/ooda-tmp/ci_struct_arc.bin
          echo "=== llvm unique bar ==="
          command -v clang >/dev/null
          "$HOST" build --backend c oodac/qa/probe_llvm_bar.oo -o .ooda-cache/ooda-tmp/ci_llvm.bin
          .ooda-cache/ooda-tmp/ci_llvm.bin
          "$HOST" build --backend c oodac/qa/probe_llvm_ty_refuse.oo -o .ooda-cache/ooda-tmp/ci_llvm_ty.bin
          .ooda-cache/ooda-tmp/ci_llvm_ty.bin
          echo "=== emit-llvm corpus ==="
          llvm_pass() {
            "$HOST" build --backend llvm "$1" -o .ooda-cache/ooda-tmp/llvm_gate.bin
            out=$(.ooda-cache/ooda-tmp/llvm_gate.bin)
            test "$out" = "$2"
          }
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/fn_ret_int.oo 42
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/println_str.oo "hello llvm"
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/if_else.oo big
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/while_sum.oo 10
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/for_range_sum.oo 10
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/for_nested_sum.oo 48
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/str_concat.oo foobar
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/list_get.oo 7
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/match_ok.oo ok
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/bool_print.oo "$(printf '0\n1\n1')"
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/result_val_err.oo "$(printf '42\nboom')"
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/str_starts_with.oo "$(printf '1\n1')"
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/user_fn_call.oo "$(printf '42\nhi\n55')"
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/multi_diamond.oo 112
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/cap_spread.oo 7
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/cap_spread2.oo 7
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/str_escapes.oo "$(printf '11\na\tb\nc\"d\\e\rf')"
          llvm_pass oodac/bootstrap/corpus/emit-llvm/pass/method_calls.oo "$(printf '1\n0\n6\n2\n42')"
          echo "=== differential C-vs-LLVM ratchet ==="
          oodac/bootstrap/corpus/differential/diffrun.sh "$HOST"
          echo "DIFF_RATCHET_OK"
          echo "=== compiler not concat ==="
          "$HOST" build --backend c oodac/qa/probe_compiler_not_concat.oo -o .ooda-cache/ooda-tmp/ci_nocat.bin
          .ooda-cache/ooda-tmp/ci_nocat.bin
          echo "=== elf hash ==="
          "$HOST" build --backend c oodac/qa/probe_elf_hash.oo -o .ooda-cache/ooda-tmp/ci_elfhash.bin
          .ooda-cache/ooda-tmp/ci_elfhash.bin
          echo "=== isolated check ==="
          "$HOST" build --backend c oodac/qa/probe_isolated_check.oo -o .ooda-cache/ooda-tmp/ci_iso.bin
          .ooda-cache/ooda-tmp/ci_iso.bin
          echo "=== double-run sealed ==="
          "$HOST" build --backend c oodac/qa/oodac_break_smoke.oo -o .ooda-cache/ooda-tmp/ci_dbl.bin
          .ooda-cache/ooda-tmp/ci_dbl.bin
          .ooda-cache/ooda-tmp/ci_dbl.bin
          echo "=== smt const-false ==="
          "$HOST" build --backend c oodac/qa/probe_smt_false_kind.oo -o .ooda-cache/ooda-tmp/ci_smt_false.bin
          .ooda-cache/ooda-tmp/ci_smt_false.bin
          .ooda-cache/ooda-tmp/ci_smt_false.bin
          echo "=== smt unproven ident ==="
          "$HOST" build --backend c oodac/qa/probe_smt_unproven_kind.oo -o .ooda-cache/ooda-tmp/ci_smt_unp.bin
          .ooda-cache/ooda-tmp/ci_smt_unp.bin
          .ooda-cache/ooda-tmp/ci_smt_unp.bin
          echo "UNIQUE_C_BAR_OK"
      - name: Compiler core is ELF
        run: |
          test -x oodac/bin/oodac_bin.core
          file oodac/bin/oodac_bin.core | grep -q 'ELF 64-bit'

  # Product `oodac build oodac/main.oo` must refuse (unique_fns). Ship the
  # committed seed ELF; do not wait on Unique C bar or a self-host rebuild.
  release-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Stage hashed compiler asset
        run: |
          set -eu
          mkdir -p dist
          test -x bin/oodac_bin.core
          cp -L bin/oodac_bin.core dist/oodac-linux-x86_64
          chmod +x dist/oodac-linux-x86_64
          file dist/oodac-linux-x86_64 | grep -q 'ELF 64-bit'
          (cd dist && sha256sum oodac-linux-x86_64 > oodac-linux-x86_64.sha256)
          test -s dist/oodac-linux-x86_64.sha256
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error
  auto-release:
    needs: release-assets
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.23
    secrets: inherit
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
