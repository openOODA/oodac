name: oodac CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count ANCHOR imports
        run: |
          n=$(grep -c '^import "' ANCHOR.oo)
          echo "ANCHOR imports: $n"
          test "$n" = "12"
      - name: Compiler core is ELF
        run: |
          test -x bin/oodac_bin.core
          file bin/oodac_bin.core | grep -q 'ELF 64-bit'
  auto-release:
    needs: test
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v1.0.6
    secrets: inherit
